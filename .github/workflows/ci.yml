name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, documentation and packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run checks in Docker
        run: bash scripts/docker_test.sh checks

  distro-test:
    name: Build and test (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu:24.04, ubuntu:26.04, fedora:44]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run ordinary tests in distro container
        run: bash scripts/docker_test.sh --distro '${{ matrix.distro }}' ordinary

  kernel-test:
    name: Kernel and live eBPF tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run tests with explicit kernel capabilities
        # The entry point specifies BPF, PERFMON, SYS_PTRACE, DAC_READ_SEARCH
        # and SYS_ADMIN, host PIDs for BPF identity, and a read-only BTF mount.
        # Docker's default seccomp and AppArmor profiles remain enabled.
        run: bash scripts/docker_test.sh kernel
